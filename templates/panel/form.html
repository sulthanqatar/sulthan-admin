{% extends "panel/base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block heading %}{{ heading }}{% endblock %}
{% block content %}
  <form class="card form-card" method="post" {% if form.is_multipart %}enctype="multipart/form-data"{% endif %}>
    {% csrf_token %}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    {% endfor %}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save</button>
      <a class="btn" href="{% url cancel_url_name %}">Cancel</a>
    </div>
  </form>
{% endblock %}
